name: Update Nuvio beta

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update bundled app
        run: npm run update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app package.json .nuvio-beta-version
          if git diff --cached --quiet; then
            echo "No Nuvio beta update found."
          else
            VERSION="$(cat .nuvio-beta-version)"
            git commit -m "Bundle Nuvio ${VERSION} for TizenBrew"
            git push
          fi
